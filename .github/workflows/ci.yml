name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Uji CLI dan isi paket
        run: |
          node packages/ui/cli/index.mjs list > /dev/null
          npm pack -w unipo-ui --dry-run > /dev/null
      - run: npm run build -w docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/dist
