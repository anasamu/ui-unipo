name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versi kedua paket sama
        run: |
          UI="$(node -p "require('./packages/ui/package.json').version")"
          TOK="$(node -p "require('./packages/tokens/package.json').version")"
          DEP="$(node -p "require('./packages/ui/package.json').dependencies['unipo-ui-tokens']")"
          [ "$UI" = "$TOK" ] && [ "$DEP" = "$TOK" ] || { echo "::error::Versi tidak sama (ui=$UI tokens=$TOK ui→tokens=$DEP). Pakai: npm run versi -- patch"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Uji CLI dan isi paket
        run: |
          node packages/ui/cli/index.mjs list > /dev/null
          npm pack -w unipo-ui --dry-run > /dev/null
      - name: Katalog mutakhir terhadap OpenAPI unipo-sdk
        # Katalog unipo-ui/katalog dibuat dari OpenAPI SIAKAD (lihat packages/ui/scripts/katalog/buat.mjs). Bila basi,
        # <KelolaSumber sumber="/v1/..."> untuk endpoint baru gagal di aplikasi ("Sumber ... tidak ada di katalog").
        # openapi.json unipo-sdk diperbarui otomatis dari SIAKAD main. PR: peringatan saja; push ke main: gagal.
        run: |
          curl -fsSL --max-time 60 https://raw.githubusercontent.com/anasamu/unipo-sdk/main/openapi.json -o /tmp/openapi.json \
            || { echo "::warning::openapi.json unipo-sdk tidak bisa diambil; pemeriksaan katalog dilewati."; exit 0; }
          if ! node packages/ui/scripts/katalog/buat.mjs --periksa /tmp/openapi.json 2> /tmp/katalog.txt; then
            cat /tmp/katalog.txt
            PESAN="Katalog unipo-ui basi terhadap openapi.json unipo-sdk. Perbarui: npm run katalog -w unipo-ui -- ../unipo-sdk/openapi.json"
            if [ "${{ github.event_name }}" = "pull_request" ]; then echo "::warning::$PESAN"; else echo "::error::$PESAN"; exit 1; fi
          fi
      - run: npm run build -w docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/dist
